[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
authors = [{ name = "The Eradiate Team" }]
description = "A radiative transfer model for the Earth observation community"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
maintainers = [{ name = "The Eradiate Team" }]
name = "eradiate"
readme = "resources/README_PyPI.md"
requires-python = ">=3.10"
version = "1.2.0"
keywords = ["radiative transfer", "earth observation", "remote sensing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "aenum>=3.1.0",
  "axsdb>=0.1.2,<0.2",
  "attrs>=22.2",
  "cachetools>=5.3",
  "cerberus>=1.3",
  "click>=8.0",
  "dessinemoi>=23.1.0",
  "dynaconf>=3.2",
  "joseki>=2.6.0",
  "lazy_loader>=0.6",
  "matplotlib>=3.3",
  "netcdf4>=1.6.5",
  "networkx>=3.0",
  "numpy>=1.26.0",
  "pint>=0.24.0",
  "pinttrs>=23.2.0",
  "pooch>=1.7.0",
  "rich>=13.6.0",
  "ruamel.yaml>=0.18.0",
  "scipy>=1.12.0",
  "typer>=0.9.0",
  "tqdm>=4.65.0",
  "xarray>=2023",
]

[project.optional-dependencies]
kernel = ["eradiate-mitsuba>=0.5.0,<0.6.0"]
recommended = [
  "aabbtree", # Used by the leaf collision detection feature
  "skyfield", # Used by the solar irradiance spectrum date-based scaling feature
  "ipython",
  "ipywidgets",
  "jupyterlab",
  "pydot", # Used to visualize post-processing pipeline DAGs
  "python-dateutil", # Used by the Solar irradiance spectrum date-based scaling feature
  "seaborn", # Used to define the Eradiate plotting style
]

[dependency-groups]
docs = [
  "myst-parser>=1.0.0",
  "nbsphinx>=0.9.0",
  "ipython", # Required for syntax highlighting in notebooks
  "pytest>=9.0", # Required for pytest-related function docs
  "pytest-datadir>=1.7.0", # Required for pytest-related function docs
  "pytest-regressions>=2.11", # Required for pytest-related function docs
  "seaborn>=0.13.0",
  "sphinx>=9.0",
  "sphinxcontrib-bibtex>=2.0",
  "sphinx-autobuild>=2024",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.0",
  "sphinx-iconify>=0.3.0",
  "shibuya>=2026.7.12",
]
test = [
  "pytest>=9.0",
  "colorcet>=3.0",
  "pytest-cov",
  "pytest-json-report",
  "pytest-datadir>=1.7.0",
  "pytest-regressions>=2.11",
  "asv==0.6.*",
  "robotframework>=6.0",
  "pytest-robotframework>=4.6.0",
  "skyfield-data>=7.0.0", # Load skyfield data from PyPI (better for CI)
  "coverage>=7.13",
]
dev = [
  "bump-my-version>=1.2.0",
  "uv==0.9.*", # Used to lock docs dependencies
  "pandas-stubs",
]

[project.scripts]
eradiate = "eradiate.cli:main"

[project.urls]
Homepage = "https://www.eradiate.eu"
Documentation = "https://eradiate.readthedocs.io"
Repository = "https://github.com/eradiate/eradiate"
Issues = "https://github.com/eradiate/eradiate/issues"
Changelog = "https://github.com/eradiate/eradiate/releases"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tool.pixi.dependencies]
pixi-pycharm = ">=0.0.12,<0.0.13"

[tool.pixi.pypi-dependencies]
eradiate = { path = ".", editable = true }

[tool.pixi.feature.docs.dependencies]
pandoc = "*"

[tool.pixi.activation]
scripts = ["setpath.sh"]

[tool.pixi.tasks]
kernel-configure = { cmd = """
  cmake -S ext/mitsuba -B ext/mitsuba/build -DCMAKE_BUILD_TYPE=Release \
    -GNinja --preset eradiate
""" }
kernel-build = { cmd = "cmake --build ext/mitsuba/build", depends-on = [
  "kernel-configure",
] }
kernel-clean = { cmd = "rm -rf ext/mitsuba/build/" }
build-kernel = { depends-on = ["kernel-build"] }
wheel-build = { cmd = "python -m build" }
build-wheel = { depends-on = ["wheel-build"] }

[tool.pixi.target.win-64.dependencies]
ninja = "*"

[tool.pixi.target.win-64.activation]
scripts = ["setpath.bat"]

[tool.pixi.target.osx-arm64.dependencies]
netcdf4 = "*"

[tool.pixi.feature]
# All supported Python versions are listed
py310 = { dependencies = { python = "3.10.*" } } # Current dev version
py311 = { dependencies = { python = "3.11.*" } } # Current docs version
py312 = { dependencies = { python = "3.12.*" } }
py313 = { dependencies = { python = "3.13.*" } }
py314 = { dependencies = { python = "3.14.*" } }
py315 = { dependencies = { python = "3.15.*" } }

[tool.pixi.feature.test.tasks]
doctest = { cmd = "make -C docs doctest" }
test = { cmd = "pytest" }
test-quick = { cmd = "pytest -m \"not slow and not regression\"" }
test-cov = { cmd = """
  pytest \
    --cov=src/eradiate \
    --cov-report=html \
    --cov-report=json \
    --cov-report=term-missing
""" }
test-cov-quick = { cmd = """
  pytest -m \"not slow and not regression\" \
    --cov=src/eradiate \
    --cov-report=html \
    --cov-report=json \
    --cov-report=term-missing
""" }
# Default Robot Framework options (output directory, tag statistics) are set
# by the pytest_robot_modify_options hook in tests/conftest.py
test-report = { cmd = "pytest -p robotframework --plot" }
test-unit-report = { cmd = "pytest -p robotframework -m unit --plot" }
test-system-report = { cmd = "pytest -p robotframework -m system --plot" }
test-regression-report = { cmd = "pytest -p robotframework -m regression --plot" }
test-slow-report = { cmd = "pytest -p robotframework -m slow --plot" }

[tool.pixi.feature.docs.tasks]
# Docs build
docs = { cmd = "make -C docs html && echo \"Documentation index at docs/_build/html/index.html\"" }
docs-build = { depends-on = ["docs"] }
docs-clean = { cmd = "make -C docs clean" }
docs-clean-build = { cmd = "make -C docs clean-build" }
docs-clean-generated = { cmd = "make -C docs clean-generated" }
docs-pdf = { cmd = "make -C docs latexpdf && echo \"Documentation PDF at docs/_build/latex/eradiate.pdf\"" }
docs-serve = { cmd = "make -C docs serve" }
docs-linkcheck = { cmd = "make -C docs linkcheck" }
docs-render-tutorials = { cmd = "python docs/tutorials/run.py --root-dir docs/tutorials run" }
# -- Important: If the Python version changes, do not forget to sync it with the
#    'build.tools.python' entry in .readthedocs.yml
docs-lock = { cmd = """
  uv pip compile --upgrade --quiet --no-progress \
    --python-version 3.11 --group docs --extra recommended \
    --output-file docs/requirements.txt pyproject.toml
""" }

[tool.pixi.feature.dev.tasks]
release = { cmd = "python resources/release.py" }
# Version bump
bump = { cmd = "bump-my-version bump --new-version $RELEASE_VERSION" }
bump-show = { cmd = "bump-my-version show-bump" }
bump-dry = { cmd = "bump-my-version bump --new-version $RELEASE_VERSION --dry-run --verbose" }
# Linting
lint = { cmd = """ruff check""" }
lint-ext = { cmd = """ruff check --extend-select B,C4,SIM,PIE,UP,PERF,NPY,RUF""" }

[tool.pixi.environments]
default = { features = ["py310", "recommended", "test", "dev"], solve-group = "dev" }
test = { features = ["py310", "recommended", "test"], solve-group = "dev" }
docs = { features = ["py311", "recommended", "docs"] }
# The following environments exist only to ensure that a production environment
# can be resolved
py310 = { features = ["py310", "kernel", "recommended"] }
py311 = { features = ["py311", "kernel", "recommended"] }
py312 = { features = ["py312", "kernel", "recommended"] }
py313 = { features = ["py313", "kernel", "recommended"] }
py314 = { features = ["py314", "kernel", "recommended"] }
py315 = { features = ["py315", "kernel", "recommended"] }
# Deprecated
dev = { features = ["py310", "recommended", "test", "dev"], solve-group = "dev" }

[tool.setuptools]
include-package-data = true # Required because of package data

[tool.setuptools.package-data]
# Required by PEP 561
# https://mypy.readthedocs.io/en/stable/installed_packages.html#creating-pep-561-compatible-packages
"eradiate" = ["py.typed", "*.pyi", "*.mplstyle", "units.txt"]
"eradiate.config" = ["*.toml"]
"eradiate.data" = ["*.yml"]
"eradiate.data.schemas" = ["*.yml"]

[tool.setuptools.packages.find]
include = ["eradiate*"]
namespaces = false
where = ["src"]
